name: OpenWrt Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build OpenWrt ${{ matrix.version }} / ${{ matrix.arch }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per (OpenWrt release, arch). fail-fast: false — one
          # target failing does not block the others.
          # 25.12 = apk packages (.apk); 24.10 = opkg (.ipk).
          # Enabled: 64-bit ARM (Pi 3/4/5, most ARM64 routers) and 32-bit
          # ARM v7 (Pi 2, many ARM routers). Uncomment to add targets:
          - { arch: aarch64_generic,          version: "25.12", sdk: aarch64_generic-openwrt-25.12 }
          - { arch: arm_cortex-a7_neon-vfpv4, version: "25.12", sdk: arm_cortex-a7_neon-vfpv4-openwrt-25.12 }
          - { arch: aarch64_generic,          version: "24.10", sdk: aarch64_generic-openwrt-24.10 }
          - { arch: arm_cortex-a7_neon-vfpv4, version: "24.10", sdk: arm_cortex-a7_neon-vfpv4-openwrt-24.10 }
          #- { arch: x86_64,                   version: "25.12", sdk: x86_64-openwrt-25.12 }
          #- { arch: mips_24kc,                version: "25.12", sdk: mips_24kc-openwrt-25.12 }
          #- { arch: mipsel_24kc,              version: "25.12", sdk: mipsel_24kc-openwrt-25.12 }
          #- { arch: x86_64,                   version: "24.10", sdk: x86_64-openwrt-24.10 }
          #- { arch: mips_24kc,                version: "24.10", sdk: mips_24kc-openwrt-24.10 }
          #- { arch: mipsel_24kc,              version: "24.10", sdk: mipsel_24kc-openwrt-24.10 }

    steps:
      - uses: actions/checkout@v5

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          PACKAGES: "davisweather luci-app-davisweather"
          # No FEED_DIR: mount the whole workspace at /feed (default). Mounting
          # only openwrt/ would break the action's shfmt check, which runs
          # git-diff inside /feed and needs the repository's .git directory.
          BUILD_LOG: 1
          IGNORE_ERRORS: 'n'
          NO_REFRESH_CHECK: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            bin/packages/${{ matrix.arch }}/action/*.apk
            bin/packages/${{ matrix.arch }}/action/*.ipk
          if-no-files-found: error

  release:
    name: Attach packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.ipk' \) | while read -r f; do
            # artifact dir: packages-<openwrt-version>-<arch>
            tmp=$(echo "$f" | cut -d/ -f2)
            ver=${tmp#packages-}; ver=${ver%%-*}
            arch=${tmp#packages-${ver}-}
            base=$(basename "$f")
            # luci-app is arch-independent per OpenWrt release: keep one copy
            # per format — the extension (.apk for 25.12, .ipk for 24.10)
            # already encodes the version, so the plain basename is unique.
            case "$base" in
              luci-app-*) dest="$base" ;;
              *) dest="openwrt-${ver}_${arch}_${base}" ;;
            esac
            cp "$f" "release/$dest"
          done
          ls -la release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
