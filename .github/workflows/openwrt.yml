name: OpenWrt Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          # All supported targets are enabled (fail-fast: false — one arch
          # failing does not block the others).
          # 64-bit ARM: Pi 3/4/5, most ARM64 routers; ARM v7: Pi 2, many ARM
          # routers; x86_64: soft routers; mips/mipsel: typical ath79/ramips
          # hardware. Go builds for all five; note mips targets are soft-float.
          - { arch: aarch64_generic,          sdk: aarch64_generic-openwrt-25.12 }
          - { arch: arm_cortex-a7_neon-vfpv4, sdk: arm_cortex-a7_neon-vfpv4-openwrt-25.12 }
          - { arch: x86_64,                   sdk: x86_64-openwrt-25.12 }
          - { arch: mips_24kc,                sdk: mips_24kc-openwrt-25.12 }
          - { arch: mipsel_24kc,              sdk: mipsel_24kc-openwrt-25.12 }

    steps:
      - uses: actions/checkout@v5

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          PACKAGES: "davisweather luci-app-davisweather"
          # No FEED_DIR: mount the whole workspace at /feed (default). Mounting
          # only openwrt/ would break the action's shfmt check, which runs
          # git-diff inside /feed and needs the repository's .git directory.
          BUILD_LOG: 1
          IGNORE_ERRORS: 'n'
          NO_REFRESH_CHECK: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.arch }}
          path: |
            bin/packages/${{ matrix.arch }}/action/*.apk
            bin/packages/${{ matrix.arch }}/action/*.ipk
          if-no-files-found: error

  release:
    name: Attach packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.ipk' \) | while read -r f; do
            arch=$(echo "$f" | cut -d/ -f2 | sed 's/^packages-//')
            base=$(basename "$f")
            # arch-independent packages (luci-app) are identical everywhere: keep one copy
            case "$base" in
              luci-app-*) dest="$base" ;;
              *) dest="${arch}_${base}" ;;
            esac
            cp "$f" "release/$dest"
          done
          ls -la release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
