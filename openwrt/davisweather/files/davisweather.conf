config davisweather 'general'
	option enabled '0'
	option port '/dev/ttyUSB0'
	option baud '19200'
	option interval '2m'
	option bucket '0.2mm'
	# none: stateless mode, failed uploads are dropped (recommended on
	# flash-backed routers); sqlite: offline buffer at db_path
	option buffering 'none'
	option db_path '/etc/davisweather/weather.db'

config davisweather 'voria2'
	option api_url 'https://api.voria2.io'
	option api_key ''
